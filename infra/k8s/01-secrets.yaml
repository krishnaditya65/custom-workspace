# Template only - every value below is a placeholder. Do not apply this file
# as-is to a real cluster; replace with your platform's secret mechanism
# (sealed-secrets, External Secrets Operator, Vault CSI, `kubectl create
# secret` from a local .env that never gets committed, ...) per
# docs/DEPLOYMENT.md "What's deliberately out of scope here".
#
# workspace-jwt-secret is read by api only (04-api.yaml) - apps/api signs and
# verifies its own access tokens. apps/sync no longer verifies tokens itself;
# it calls api's POST /internal/sessions/verify instead (see
# workspace-internal-secret below).
apiVersion: v1
kind: Secret
metadata:
  name: workspace-jwt-secret
  namespace: custom-workspace
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "REPLACE-ME-generate-with-openssl-rand-hex-32"
---
# workspace-internal-secret is read by BOTH api and sync (04-api.yaml,
# 05-sync.yaml) - INTERNAL_SERVICE_SECRET must be byte-identical across both,
# since sync authenticates its POST /internal/sessions/verify calls to api
# with it (sent as the x-internal-secret header). See docs/DEPLOYMENT.md
# "Required configuration".
apiVersion: v1
kind: Secret
metadata:
  name: workspace-internal-secret
  namespace: custom-workspace
type: Opaque
stringData:
  INTERNAL_SERVICE_SECRET: "REPLACE-ME-generate-with-openssl-rand-hex-32"
---
apiVersion: v1
kind: Secret
metadata:
  name: workspace-api-secret
  namespace: custom-workspace
type: Opaque
stringData:
  JWT_REFRESH_PEPPER: "REPLACE-ME-generate-with-openssl-rand-hex-32"
---
# Postgres credentials, shared by the in-cluster postgres StatefulSet
# (02-postgres.yaml) and every service's DATABASE_URL. For real production
# use, point DATABASE_URL at a managed Postgres instead and drop
# 02-postgres.yaml entirely - see docs/DEPLOYMENT.md "Kubernetes".
apiVersion: v1
kind: Secret
metadata:
  name: workspace-postgres-secret
  namespace: custom-workspace
type: Opaque
stringData:
  POSTGRES_USER: workspace
  POSTGRES_PASSWORD: "REPLACE-ME-generate-with-openssl-rand-hex-32"
  POSTGRES_DB: workspace
  # Must match the user/password/db above. Service name "postgres" is
  # defined in 02-postgres.yaml.
  DATABASE_URL: "postgresql://workspace:REPLACE-ME-generate-with-openssl-rand-hex-32@postgres:5432/workspace?schema=public"
